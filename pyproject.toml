[project]
name = "asmrai"
version = "0.1.2"
description = "Stil-Analyse und eigene ASMR-Sessions aus Creator-Archiven (lokal)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "pyyaml"]

[project.optional-dependencies]
full = ["librosa", "faster-whisper", "coqui-tts", "opencv-python", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
